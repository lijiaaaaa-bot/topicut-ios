# "Term (requires_new_architecture)", and not_used terms as "Term (not used)".
tech_terms:
  implemented: [Swift, SwiftPM, Foundation, URLSession, DeepSeek, Swift Testing, Codable, JSON, SpeechAnalyzer, SpeechTranscriber, AVFoundation, SwiftUI, Keychain, xcodegen, Speech, PhotosUI, Core Text, AVKit, TestFlight]
  planned: []
  requires_new_architecture: []
  not_used: [Metal, SceneKit, CoreML, WhisperKit, Whisper, ffmpeg, PySide6, Ollama, CATextLayer]
