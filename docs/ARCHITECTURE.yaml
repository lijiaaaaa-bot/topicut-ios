planned:
  - name: Matrix variants
    status: planned
    tech: []
    note: multiple renders (durations, caption styles) of approved clips; depends on renderer.
  - name: EDL editing in app
    status: planned
    tech: []
    note: "Head/tail trim + adjacent merge are implemented (EDLClipTrim / EDLClipMerge + edit half-sheet). Richer multi-select merge / split remains planned (ADR-0026)."
  - name: Slice and highlight taste controls
    status: planned
    tech: []
    note: "SlicingTaste + SliceStudio gate (ADR-0028) implemented; further knobs (tone/domain UI) remain planned (ADR-0026)."
  - name: Interactive crop framing
    status: planned
    tech: []
    note: "Drag focus + pinch zoom on phonePortrait are implemented in 成片工作室 (CropFocusPad, CropOverride zoom, live preview); freehand polygon crop remains planned (ADR-0026)."
  - name: Background rendering
    status: planned
    tech: []
    note: keep exports running when the app is backgrounded.

requires_new_architecture:
  - name: Multi-tenant backend
    note: explicitly rejected; see docs/DECISIONS.md ADR-0001
  - name: Cloud rendering
    note: contradicts client-side rendering decision
  - name: Recording from non-Kuaishou live sources
    note: capture pipeline is a different product surface
  - name: Android or HarmonyOS ports
    note: "this codebase is Swift/Speech/AVFoundation; a second client would re-implement ASR+render on that OS. Cloud LLM step is portable; on-device speech and composition are not (ADR-0026)."

