# Source of truth for "what exists" vs "what is planned". Guards read this file.
# Rules:
#   - implemented  = code that exists in this repo today and has a caller listed in called_by
#   - planned      = decided, not written; MUST NOT be described as present anywhere in docs
#   - requires_new_architecture = explicitly out of scope for this codebase shape
# Format is a deliberately small YAML subset (see scripts/guards/lib/arch_yaml.py).

version: 1.0.0
schema_version_of_edl: 1

implemented:
  - path: Package.swift
    status: implemented
    kind: manifest
    purpose: SwiftPM manifest; iOS 26 / macOS 26; Core, ASR, Render, Keychain, UI, TestSupport, cli + tests; depends on the sibling LiJiaKit package (product LLMKit) by local path (ADR-0023)
    called_by:
      - scripts/gate.sh
      - project.yml
  - path: ../LiJiaKit/Package.swift
    status: implemented
    kind: external_package
    purpose: shared LiJiaKit package, checked out next to this repo; `LLMKit` provides DeepSeekClient / DeepSeekConfiguration / ChatMessage / LLMUsage / ChatCompletionResult (OpenAI-compatible chat over URLSession, usage required, thinking disabled in both dialects per ADR-0020) and LLMJSON (fence stripping + outermost object + DecodingError description). Tests live in that repo (`swift test` there); this repo's gate does not re-run them
    called_by:
      - Package.swift
      - Sources/LiveSliceCore/TopicSlicer.swift
      - Sources/LiveSliceCore/LLMResponseParser.swift
      - Sources/LiveSliceCore/EDLDocument.swift
